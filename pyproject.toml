[project]
name = "goalcat"
version = "0.1.0"
description = "Goal-driven categorization of process variants anchored in a declared goal model"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Daniel Calegari" }]

# AGPL-3.0 is not a choice: pm4py imposes it, and the repository adopts it.
dependencies = [
    "pm4py==2.7.23.5",
    "pandas>=2.2",
    "PyYAML>=6.0",
    # Only used by third_party/lupin/render_narratives.py, invoked as a subprocess (see its
    # README's isolation contract) — never imported by src/goalcat itself.
    "Jinja2>=3.1",
    # Not actually optional: llm/taxonomy.py, llm/assignment.py, llm/description.py, and
    # llm_backend.py all define pydantic BaseModel subclasses at module scope (Category,
    # Taxonomy, Assignment, ...), and pipeline.py imports all three llm.* modules at module
    # load — so `import goalcat.pipeline` needs pydantic even for a Steps-1-4-only base
    # install. litellm stays in the [llm] extra below since its import is deferred inside
    # LLMBackend's methods, not at module scope, so it's genuinely optional at import time.
    "pydantic>=2,<3",
    # goalcat/grl/jucm_io.py reads/writes .jucm (GRL/URN XMI) through pyecore, a Python EMF
    # implementation, against the real metamodel vendored under third_party/jucmnav/ — .jucm is
    # the sole goal-model artifact (data/goals/*_goal_model.jucm), read by llm/taxonomy.py at
    # module scope like pydantic above, so this is a base dependency, not an [llm]-extra one.
    "pyecore>=0.15",
    # extraction/similarity.py imports these directly for Step 6's structural/profile distance
    # computation, at module scope (pipeline.py imports similarity.py at module load, same as
    # pydantic/pyecore above). Already transitive via pm4py, but declared explicitly since a
    # transitive dependency's own requirements can change without notice.
    "numpy>=1.26",
    "scipy>=1.11",
    # pandas' Parquet read/write backend for Step 6's structural_distances.parquet/
    # profile_distances.parquet (extraction/similarity.py, llm/assignment.py, review.py). Was
    # already present transitively via the [gui] extra's streamlit, but that made it an implicit
    # dependency of a base-package code path — declared explicitly here since Steps 6/9 need it
    # regardless of whether the GUI extra is installed.
    "pyarrow>=18",
    # C-accelerated Levenshtein distance for extraction/similarity.py's structural-distance
    # computation. pm4py's own string_distance.levenshtein() already prefers a C backend
    # (`stringdist`) when installed, falling back to a pure-Python O(n*m) loop otherwise; this
    # project calls the pure-Python function directly, which is what made BPIC 2019's ~71.7M
    # variant-pair count (Step 6) take on the order of an hour of CPU. rapidfuzz's
    # distance.Levenshtein and process.cdist give byte-identical results (verified against
    # pm4py's own implementation) at ~25x the raw per-pair speed and, via process.cdist's
    # multi-threaded C loop, the full BPIC 2019 pairwise matrix in ~2s instead of ~1h.
    "rapidfuzz>=3.14",
    # pandas' DataFrame.to_markdown() backend — experimentation/icpm2027/analysis/{report,
    # coverage,divergence}.py call it unconditionally when writing Task C9/D1/§3 evidence
    # tables, so a missing install doesn't surface until report-generation time, well after an
    # experiment's LLM calls have already been billed. Declared as a base dependency rather than
    # an extra since run_experiment.py's driver needs it on every dataset run, not only when
    # analysis is invoked separately.
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Steps 5a/5b, 6, 8 (Task 5+): the LLM API call itself. litellm>=1.83.0 is a hard floor, not
# just a recency preference — versions 1.82.7 and 1.82.8 were a confirmed PyPI supply-chain
# compromise (credential-stealing malware; CVE-2026-33634, March 2026); 1.83.0+ was rebuilt on
# litellm's post-incident CI/CD pipeline. Pin via lockfile, not just this floor.
llm = [
    "litellm>=1.83.0",
]
# Local GUI (src/gui/, sibling of src/goalcat/): st.fragment(run_every=...) and
# st.switch_page() both need 1.38+. Run entirely locally (`streamlit run src/gui/app.py`) — no
# hosted/paid service.
gui = [
    "streamlit>=1.38",
]
# `tests/` — the regression guards on the arithmetic and structural rules the reported numbers
# rest on (axis frontier, partition check, coverage, reassignment). No LLM call, no network.
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# goalcat is the pipeline library; experimentation (case-study drivers) and gui (the Streamlit
# app) are separate top-level packages, not subpackages of goalcat — both import it as a
# dependency (`from goalcat... import ...`), never the reverse. experimentation lives at the
# repository root rather than under src/: it consumes goalcat but isn't part of the implemented
# core, unlike gui, which stays alongside goalcat under src/.
packages = ["src/goalcat", "src/gui", "experimentation"]
