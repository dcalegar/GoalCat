# Case-study configuration for the full RTFM log (231 variants), used by
# experimentation/rtfm/example_run.py. Same settings as src/goalcat/config.yaml, kept as its own
# copy under experimentation/ so this case study is self-contained like its siblings — see that
# file's header for the rationale behind each setting.

log_filename: rtfm.xes.gz
goal_model_filename: rtfm_goal_model.md
output_dir: data/output

run_id: null
round: null

case_id_key: "case:concept:name"
activity_key: "concept:name"
timestamp_key: "time:timestamp"
resource_key: "org:resource"

sample_frequent_n: 10
sample_rare_n: 10
sample_extreme_n: 5

taxonomy_mode: "intent_guided"

discovery_noise_threshold: 0.0

llm:
  taxonomy_model: "gemini/gemini-3.5-flash-lite"
  assignment_model: "gemini/gemini-3.5-flash-lite"
  description_model: "gemini/gemini-3.5-flash-lite"
  temperature: 0
  timeout_seconds: 120
  max_retries: 3
  concurrency: 1
  requests_per_minute: 12
  assignment_batch_size: 20
