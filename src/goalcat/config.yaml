# Default pipeline configuration.
# Paths are resolved relative to the repository root, regardless of the
# working directory the pipeline is invoked from.

# Log filename only — resolved under the fixed data/logs/ directory.
log_filename: rtfm.xes.gz
# Goal model filename only — resolved under the fixed data/goals/ directory (Step G's frozen
# artifact for this log, e.g. data/goals/rtfm_goal_model.jucm — the sole goal-model input; any
# .md file alongside it is documentation, never read by the pipeline). Read by Step 5a even if
# taxonomy_mode is later switched to "open", since switching modes back is a config edit away.
goal_model_filename: rtfm_goal_model.jucm
output_dir: data/output

# Which run directory to use, under output_dir/<log_stem>/ — e.g. "20260818_105007". Unset (or
# null): a fresh timestamped directory, empty, for a complete run from scratch. Set to an
# existing run's id: every step reads whatever it needs (variants/profiles/narratives/taxonomy)
# from that directory instead of recomputing it, and only adds what's missing — e.g. point this
# at a Step 5 run's id before calling Step 6, and it picks up that run's taxonomy.json directly,
# writing its own assignment outputs into the same directory. A run_stepN_*() call's run_id=
# argument (for chaining several steps within one process) takes priority over this field.
run_id: null

# Which round (Steps 5-9, nested under run_id/roundN/) a standalone call addresses. Resolution
# differs from run_id's: round (arg) > this field > auto-detected as the highest existing roundN/
# already on disk for this run_id (or 1 for a fresh execution) — the useful default is "continue
# the current round," not "start something new." Only Step 9's merge/split path ever explicitly
# requests round + 1. Steps 1-4 ignore this field entirely (they're execution-scoped).
round: null

case_id_key: "case:concept:name"
activity_key: "concept:name"
timestamp_key: "time:timestamp"
resource_key: "org:resource"

# Narrative sampling (Step 4): number of variants per bucket, before deduplication.
sample_frequent_n: 10
sample_rare_n: 10
sample_extreme_n: 5

# Step 5: which taxonomy-induction mode to run. "intent_guided" (5a) subdivides the goal
# model's declared OR/XOR axis; "open" (5b) proposes categories with no external axis. Both are
# implemented (run_step5_taxonomy() dispatches on this field); kept as an explicit, auditable
# switch rather than inferred from whether a goal-model file happens to exist.
taxonomy_mode: "intent_guided"

# Step 7: Inductive Miner noise threshold, applied uniformly to every category's sub-log —
# OVERVIEW.md requires "fixed hyperparameters across categories", not per-category tuning. 0.0
# (no denoising) matches pm4py.discover_petri_net_inductive's own default; categories are already
# curated, LLM-assigned subsets, not raw noisy variant sets, so there is no a priori reason to
# filter infrequent behavior out of them by default.
discovery_noise_threshold: 0.0

# Step 9: precision (Step 7, token-based replay) below this is flagged, as an advisory comment
# only, in the review_decisions.yaml template write_review_template() writes for the human
# reviewer — never applied automatically, never overrides Step 9's human-decision gate. Low
# precision under a fitness-preserving discovery method (Inductive Miner at noise_threshold 0.0)
# is a heuristic signal that a category's sublog may still conflate distinct behavioral patterns,
# not proof of it; 0.3 is a starting point, not an empirically validated cutoff — tune per log if
# it proves too noisy or too quiet in practice.
review_precision_flag_threshold: 0.3

# Step 9 (accept only): deletes structural_distances.csv/profile_distances.csv from every round
# of this execution, not just the round being accepted — these are Step 6's O(n^2) pairwise
# variant-distance tables (one row per variant pair), the single largest artifact class at scale
# (measured ~3.9 GB of a 4.1 GB BPIC 2019 run directory). Off by default: a superseded round's
# copies are what rerender_reports_after_rename() reads if that round is ever re-reviewed with a
# rename decision, and Step 6 has no reuse guard for these two tables, so a later rename against a
# pruned round forces a full O(n^2) recompute (~1h wall clock at BPIC 2019 scale) just to relabel
# a category. Turn on only when disk pressure at this scale outweighs that risk — the raw pairwise
# rows are not recoverable afterward, only the aggregate stats already baked into
# assignment_report.md.
prune_pairwise_distances_on_finalize: false

# LLM steps (5a/5b, 6, 8). Model strings are litellm "provider/model" IDs — swapping
# provider (e.g. to anthropic/claude-... or openai/...) is a config-only change, no code
# change. Gemini 3.5 Flash-Lite chosen for cost (see PROGRESS.md; 2.5 Flash-Lite was the
# original choice, deprecated by Google mid-project — see Task 5's entry); Flash is the
# Step-5-only comparison point, not a default. API keys (GEMINI_API_KEY / OPENAI_API_KEY /
# ANTHROPIC_API_KEY) must be exported from the user's shell profile (e.g. ~/.bash_profile) —
# never stored in any file in this repository (originally kept under a synced Google Drive
# folder, since relocated — see PROGRESS.md, "Gemini API key: storage location" and "Project
# retitled and package renamed"). litellm reads them from the environment automatically.
llm:
  taxonomy_model: "gemini/gemini-3.5-flash-lite"
  assignment_model: "gemini/gemini-3.5-flash-lite"
  description_model: "gemini/gemini-3.5-flash-lite"
  # USD per 1M tokens, standard (non-batch) tier, keyed by the exact model string above — used
  # only to annotate *_run_metadata.json with an estimated_cost_usd per call (see
  # llm_backend.estimate_cost_usd); never sent to litellm. A model with no entry here logs
  # estimated_cost_usd: null rather than a fabricated 0.0. Verified 2026-08-19 at
  # ai.google.dev/gemini-api/docs/pricing; re-check there before trusting this for a paper's
  # cost figures if the run postdates that check by long enough for pricing to have moved.
  pricing_usd_per_million_tokens:
    "gemini/gemini-3.5-flash-lite":
      input: 0.30
      output: 2.50
  temperature: 0
  timeout_seconds: 120
  max_retries: 3
  # 5: restored after confirming the paid tier is active. Gemini's free tier capped
  # gemini-3.5-flash-lite at 15 requests/minute, discovered when Step 6's first live run (231
  # calls) hit RateLimitError at concurrency=5 — litellm's own retries compounded the burst. That
  # forced concurrency down to 1 with proactive pacing (see requests_per_minute below) as a
  # workaround. Verified 2026-08-19 at aistudio.google.com/rate-limit after enabling billing:
  # paid tier is 4,000 RPM / 4M TPM (same for gemini-2.5-flash-lite and gemini-3.5-flash-lite),
  # plus 150K RPD specific to 3.5-flash-lite — several orders of magnitude above this pipeline's
  # actual volume (a Step 6 batch of 20 narratives is ~4,233 input / 1,135 output tokens; a full
  # run is dozens of calls, not thousands per minute), so no proactive pacing is needed.
  #
  # NOT fixed via Gemini Batch — investigated and ruled out (see PROGRESS.md): litellm's
  # create_batch only routes Google calls through custom_llm_provider="vertex_ai" (GCP project +
  # service-account auth, separate billing/quota from this key), never "gemini" (Google AI
  # Studio / GEMINI_API_KEY, what this file actually uses). Switching provider families just to
  # get batching was judged not worth it. Ollama has no batch concept either, for anyone who
  # points a model field at a local model — it's synchronous local inference, no job queue to
  # submit to.
  #
  # Note the same paid-tier switch also matters for the unrelated free-tier data-use policy
  # already recorded in PROGRESS.md (free tier content may be used to improve Google's products;
  # paid tier content is not).
  concurrency: 5
  # null = no proactive pacing. Safe at the verified paid-tier RPM above — litellm's own
  # num_retries backoff can absorb the rare 429 without needing to throttle requests manually.
  # If the account ever reverts to free tier (15 RPM), set this back to a low value (e.g. 12) —
  # per-call latency (~1s) alone is far faster than 15 requests/minute, so concurrency=1 without
  # pacing still overruns it.
  requests_per_minute: null
  # Step 6: how many narratives go into a single assignment prompt/response, instead of one LLM
  # call per narrative. 50 narratives -> ~5 calls for a 231-narrative run instead of 231 (raised
  # from 20 once the paid tier's headroom made a larger batch safe), trading away per-narrative
  # failure isolation for call-count reduction: a failed/invalid batch response leaves every
  # narrative in that batch pending (retried on the next call against the same run_id, per
  # load_prior_assignments()'s resume logic), not just one. Lower this back toward 1 if that
  # coarser failure granularity becomes a practical problem.
  assignment_batch_size: 50
