# Case-study configuration for the BPIC 2020 "Permit" log, used by
# experimentation/examples/bpic2020_permit/example_run.py. Sample sizes and LLM settings mirror
# src/goalcat/config.yaml's defaults; only log_filename and goal_model_filename are log-specific
# — see that file's header for the rationale behind each shared setting. goal_model_filename
# points at bpic2020_goal_model.jucm (data/goals/), the frozen goal model shared by every BPIC
# 2020 sub-log, not a "permit"-specific file.

log_filename: bpic2020_permit.xes.gz
goal_model_filename: bpic2020_goal_model.jucm
output_dir: data/output

run_id: null
round: null

case_id_key: "case:concept:name"
activity_key: "concept:name"
timestamp_key: "time:timestamp"
resource_key: "org:resource"

sample_frequent_n: 10
sample_rare_n: 10
sample_extreme_n: 5

taxonomy_mode: "intent_guided"

discovery_noise_threshold: 0.0

llm:
  taxonomy_model: "gemini/gemini-3.5-flash-lite"
  assignment_model: "gemini/gemini-3.5-flash-lite"
  description_model: "gemini/gemini-3.5-flash-lite"
  temperature: 0
  timeout_seconds: 120
  max_retries: 3
  concurrency: 1
  requests_per_minute: 12
  assignment_batch_size: 20
