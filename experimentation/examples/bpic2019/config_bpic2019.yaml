# Case-study configuration for the BPIC 2019 log (purchase-order handling), used by
# experimentation/examples/bpic2019/example_run.py. Sample sizes and LLM settings mirror src/goalcat/
# config.yaml's defaults; only log_filename and goal_model_filename are log-specific — see that
# file's header for the rationale behind each shared setting.

log_filename: bpic2019.xes.gz
goal_model_filename: bpic2019_goal_model.jucm
output_dir: data/output

run_id: null
round: null

case_id_key: "case:concept:name"
activity_key: "concept:name"
timestamp_key: "time:timestamp"
resource_key: "org:resource"

sample_frequent_n: 10
sample_rare_n: 10
sample_extreme_n: 5

taxonomy_mode: "intent_guided"

discovery_noise_threshold: 0.0

llm:
  taxonomy_model: "gemini/gemini-3.5-flash-lite"
  assignment_model: "gemini/gemini-3.5-flash-lite"
  description_model: "gemini/gemini-3.5-flash-lite"
  # USD per 1M tokens, standard tier (see src/goalcat/config.yaml for the full rationale).
  # Verified 2026-08-19 at ai.google.dev/gemini-api/docs/pricing.
  pricing_usd_per_million_tokens:
    "gemini/gemini-3.5-flash-lite":
      input: 0.30
      output: 2.50
  temperature: 0
  timeout_seconds: 120
  max_retries: 3
  concurrency: 5
  requests_per_minute: null
  assignment_batch_size: 50
