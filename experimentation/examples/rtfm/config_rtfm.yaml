# Case-study configuration for the full RTFM log (231 variants), used by
# experimentation/examples/rtfm/example_run.py. Same settings as src/goalcat/config.yaml, kept as its own
# copy under experimentation/examples/ so this case study is self-contained like its siblings — see that
# file's header for the rationale behind each setting.

log_filename: rtfm.xes.gz
goal_model_filename: rtfm_goal_model.jucm
output_dir: data/output

run_id: null
round: null

case_id_key: "case:concept:name"
activity_key: "concept:name"
timestamp_key: "time:timestamp"
resource_key: "org:resource"

sample_frequent_n: 10
sample_rare_n: 10
sample_extreme_n: 5

taxonomy_mode: "intent_guided"

discovery_noise_threshold: 0.0

llm:
  taxonomy_model: "gemini/gemini-3.5-flash-lite"
  assignment_model: "gemini/gemini-3.5-flash-lite"
  description_model: "gemini/gemini-3.5-flash-lite"
  # USD per 1M tokens, standard tier (see src/goalcat/config.yaml for the full rationale).
  # Verified 2026-08-19 at ai.google.dev/gemini-api/docs/pricing.
  pricing_usd_per_million_tokens:
    "gemini/gemini-3.5-flash-lite":
      input: 0.30
      output: 2.50
  temperature: 0
  timeout_seconds: 120
  max_retries: 3
  concurrency: 5
  requests_per_minute: null
  assignment_batch_size: 50

# Step 7b (optional): measure each goal-model indicator over each category's sublog, convert it
# through the indicator's own KPIEvalValueSet, and propagate the result up the goal model. A no-op
# unless the goal model binds its indicators to the log with goalcat:* metadata (only RTFM's does),
# so this flag exists to turn the step off on a model that *could* run it. Deterministic and cheap:
# no LLM call and no alignment computation.
skip_indicators: false
