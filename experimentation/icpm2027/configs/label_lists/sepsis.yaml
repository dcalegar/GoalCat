# Task C5 label-list control — Sepsis
#
# Authorship record (required by conditions.py:load_label_list): this list was drafted by
# Claude Sonnet 5 at the request of the paper's author (Daniel Calegari), on 2026-09-04, as a
# DRAFT pending the author's review before any condition reads it. No file under data/goals/ or
# experimentation/icpm2027/ was consulted while drafting.
#
# Sepsis declares two independent axes (admission, discharge; Table setup), but the label-list
# arm runs once per dataset (protocol.py: ConditionSpec.effective_axis is None for this arm, the
# same way one open run is the comparator for both guided axes). One shared list therefore cannot
# match both T^G cardinalities at once (admission |T^G|=2, discharge |T^G|=5). This list matches
# discharge's cardinality (5), the richer of the two comparisons; against admission's guided
# arm it is necessarily a coarser-vs-finer comparison rather than a matched-cardinality one, and
# that mismatch should be stated as a limitation wherever this control's admission-axis numbers
# are reported.
#
# The categories below classify a case by clinical course and disposition — a standard framing
# in general hospital-outcome/sepsis-care reporting (recovery complexity, escalation of care
# during the stay, and discharge disposition) — rather than by the specific admission-unit
# destination (IC/NC) or the log's own anonymized Release A-E event labels that the study's goal
# model anchors to.
#
# This independence cannot be checked automatically (conditions.py's own docstring). Before this
# file backs a billed condition, a human must confirm the categories are not, in fact, a
# relabeling of the goal-model frontier or of the log's Release A-E / IC-NC event vocabulary.

labels:
  - category_id: uncomplicated_recovery
    name: Uncomplicated recovery
    description: >-
      The case follows a standard course to discharge, with no recorded escalation of care
      and no extended observation beyond the ordinary stay pattern.
    rationale: >-
      The baseline disposition category against which the other four represent some
      departure — either in duration, care intensity, or discharge circumstance.

  - category_id: extended_monitoring_recovery
    name: Extended monitoring before discharge
    description: >-
      The case recovers without escalation of care, but the trace shows a materially longer
      observation period than the uncomplicated pattern before discharge.
    rationale: >-
      Separates duration from severity: a longer stay is not, on its own, evidence that care
      was escalated.

  - category_id: care_escalation_during_stay
    name: Escalation of care during the stay
    description: >-
      The trace shows an increase in care intensity at some point after admission (e.g., a
      transfer to a higher level of care) followed by eventual discharge.
    rationale: >-
      Captures cases whose clinical course was non-monotonic — an escalation mid-stay —
      independent of which specific unit received the transfer.

  - category_id: early_or_irregular_discharge
    name: Early or irregular discharge
    description: >-
      The trace ends in a discharge that departs from the standard pattern captured by the
      other categories — e.g., an unusually short stay relative to the case's recorded
      severity indicators, suggesting discharge ahead of the typical course.
    rationale: >-
      A residual pattern distinct from non_home_disposition: the case still ends in a
      discharge event, just not one following the ordinary course.

  - category_id: non_home_disposition
    name: Non-home disposition
    description: >-
      The trace ends in a disposition other than a routine discharge — e.g., in-hospital
      death or transfer to another facility — rather than release to the patient's prior
      living situation.
    rationale: >-
      The most severe disposition category, kept separate because it reflects a different
      kind of case ending than any discharge-based category.
