# Task C5 label-list control — BPIC 2019
#
# Authorship record (required by conditions.py:load_label_list): this list was drafted by
# Claude Sonnet 5 at the request of the paper's author (Daniel Calegari), on 2026-09-04, as a
# DRAFT pending the author's review before any condition reads it. No file under data/goals/ or
# experimentation/icpm2027/ was consulted while drafting.
#
# The study's own goal model anchors BPIC 2019's "matching regime" axis to how a purchase-order
# line was invoice-matched (two-way, three-way before/after goods receipt, consignment
# consumption) — a procurement-mechanics framing. This list instead classifies a case by its
# accounts-payable *exception profile* — a standard framing in purchase-to-pay (P2P) process
# analytics/audit practice (straight-through rate, discrepancy/blocked-invoice rates, cancellation
# rate) — independent of which matching regime governed it. Same cardinality as the guided
# taxonomy (|T^G|=4, Table setup) by construction.
#
# This independence cannot be checked automatically (conditions.py's own docstring). Before this
# file backs a billed condition, a human must confirm the categories are not, in fact, a
# relabeling of the goal-model frontier or of the log's matching-regime attribute.

labels:
  - category_id: straight_through_processing
    name: Straight-through processing
    description: >-
      The invoice is processed and paid with no recorded exception, block, discrepancy
      correction, or cancellation — the shortest, most direct realization of the process.
    rationale: >-
      The baseline exception-free category against which the other three represent some
      departure, independent of which matching mechanism the case used.

  - category_id: discrepancy_resolved
    name: Discrepancy resolved before payment
    description: >-
      A price, quantity, or date discrepancy is detected and corrected on record before the
      invoice is paid, without a full block or cancellation.
    rationale: >-
      Captures cases whose exception was resolved within the normal flow, distinct from a
      formally blocked case.

  - category_id: delayed_or_blocked_payment
    name: Delayed or blocked payment
    description: >-
      Payment occurs materially after the invoice's recorded terms, or a payment-block event is
      on record, without the case ending in a cancellation or reversal.
    rationale: >-
      A distinct operational failure mode from a resolved discrepancy: the case proceeds but
      payment itself is late or held.

  - category_id: cancelled_or_reversed
    name: Cancelled or reversed
    description: >-
      The purchase order or invoice is cancelled or reversed on record rather than completed
      through to payment.
    rationale: >-
      The most severe category, kept separate because it reflects the process not completing
      as intended rather than completing late or with correction.
