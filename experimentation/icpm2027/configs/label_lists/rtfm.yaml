# Task C5 label-list control — RTFM (Road Traffic Fine Management)
#
# Authorship record (required by conditions.py:load_label_list): this list was drafted by
# Claude Sonnet 5 at the request of the paper's author (Daniel Calegari), on 2026-09-04, as a
# DRAFT pending the author's review before any condition reads it. No file under data/goals/ or
# experimentation/icpm2027/ was consulted while drafting — the categories below were composed
# from a generic, domain-plausible framing of how a debt-collection/back-office analyst (not a
# legal-process analyst) would bucket administrative-fine case outcomes: by settlement mechanics
# (single payment vs. installments) and escalation path (dispute vs. collections), rather than by
# the appeal channel (administrative vs. judicial) the study's own goal model uses to draw its
# axis. Same cardinality as the guided taxonomy (|T^G|=5, Table setup) by construction, but the
# boundary is deliberately drawn along a different axis than administrative/judicial appeal.
#
# This independence cannot be checked automatically (conditions.py's own docstring). Before this
# file backs a billed condition, a human must confirm the categories are not, in fact, a
# relabeling of the goal-model frontier.

labels:
  - category_id: single_payment_settlement
    name: Single-payment settlement
    description: >-
      The fine is settled in one payment covering the full amount due at that point in the
      case, with no installment structure and no formal dispute on record.
    rationale: >-
      Distinguishes cases whose settlement required no payment plan from those that did,
      independent of whether the amount paid included an added penalty.

  - category_id: installment_settlement
    name: Installment or partial-payment settlement
    description: >-
      The fine is settled through two or more separate payments over time, with no formal
      dispute on record — a payment-plan pattern rather than a single transaction.
    rationale: >-
      Separates settlement mechanics (how payment was structured) from settlement timing,
      which the appeal-channel framing does not distinguish on its own.

  - category_id: formal_dispute
    name: Formal dispute lodged
    description: >-
      The offender contests the fine through any formal channel on record (e.g., a filing
      with an administrative or judicial authority), regardless of which channel or of the
      dispute's outcome.
    rationale: >-
      Merges administrative and judicial contestation into one bucket, on the premise that,
      from a collections-office perspective, what matters operationally is that the case left
      the standard payment track, not which forum received the challenge.

  - category_id: referred_to_collections
    name: Referred to external collections
    description: >-
      The case is escalated to an external credit-collection process because it was not
      settled or contested through the standard channels within the observed trace.
    rationale: >-
      A case that reaches enforced collection is operationally distinct regardless of how it
      got there, so it is kept separate from formal_dispute even where a dispute preceded it.

  - category_id: unresolved_other
    name: Unresolved or other
    description: >-
      The observed trace ends without a payment, a dispute filing, or a referral to
      collections — an open, ambiguous, or otherwise unclassifiable case.
    rationale: >-
      A residual bucket for traces that do not exhibit any of the four settlement/escalation
      patterns above, kept distinct from the pipeline's own no-match residual.
