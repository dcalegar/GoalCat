# ICPM 2027 — BPIC 2019 dataset spec. See rtfm.yaml's header for what this file does and does not
# carry.
dataset_id: bpic2019
log_filename: bpic2019.xes.gz
goal_model_filename: bpic2019_goal_model.jucm
case_id_key: "case:concept:name"
activity_key: "concept:name"
timestamp_key: "time:timestamp"
resource_key: "org:resource"

# §5: large-scale case — high absolute diversity (11,973 variants / 251,734 cases).
role: large_scale_case
# Task C7: resolved from preregistration.yaml's C7_bpic2019_variant_scope decision, not fixed
# here — the plan requires this to be pre-registered as a decision with a date and a rationale,
# not silently baked into a dataset file.
variant_scope:
  policy: from_preregistration
  decision: C7_bpic2019_variant_scope

# Task C1 — the project's one non-partition-divergence validation opportunity: the log's own
# organization-supplied label, verified never to reach the narrative (narrative/textualization.py
# builds the LUPIN input from a fixed field set; no case attribute reaches it). Excluded from the
# narrative by construction; used only by analysis/heldout.py, after assignment.
heldout_case_attribute: "case:Item Category"

# Maps each declared goal-model alternative (by anchor id) to the `case:Item Category` value that
# names the same regime. Axis-aligned by construction — the goal model was authored knowing this
# attribute exists (see analysis/heldout.py's CAVEAT and README Task C1). Observed value counts
# (per case, 2026-08-31): "3-way match, invoice before GR" 221,010; "3-way match, invoice after
# GR" 15,182; Consignment 14,498; "2-way match" 1,044.
heldout_label_map:
  "5": "3-way match, invoice after GR"      # matched_after_gr  — 3-way, invoice recorded after goods receipt
  "6": "3-way match, invoice before GR"     # matched_before_gr — 3-way, invoice recorded before goods receipt
  "7": "2-way match"                        # two_way_matched   — no goods receipt required
  "13": "Consignment"                       # consignment_consumption
# Consignment has no distinguishing activity label in the log, so its recovery figure is reported
# but flagged as not comparable to the other three (README, Task C1).
heldout_incomparable_labels:
  - "Consignment"
