# ICPM 2027 — pre-registered decisions.
#
# Every entry here is a decision the design requires to be fixed BEFORE the run it governs, so that
# it cannot be chosen after observing that run's categorization output (Tasks C7 and C10 state
# this discipline explicitly). protocol.py refuses to launch a frozen run while any decision
# governing it is still `status: pending`, unless the driver is invoked with
# --allow-pending-decisions (which stamps the run's manifest as NOT pre-registered).
#
# To pre-register a decision: set its `value`, set `status: decided`, and fill `decided_on` and
# `rationale`. Do not edit a decision after the run it governs has executed — supersede it with a
# new protocol_version instead.

decisions:

  C7_bpic2019_variant_scope:
    task: C7
    question: >-
      BPIC 2019 variant scope: all 11,973 variants, or top-N by case coverage? At
      assignment_batch_size=20 the full scope is ~600 Step-6 calls per condition, i.e. ~2,400
      across the paired design with Task C2's replicates.
    governs: [bpic2019]
    status: decided
    # policy: all | top_n_variants | min_case_coverage
    value:
      policy: all
      top_n: 1000
      # Only read when policy == min_case_coverage: keep the most frequent variants until this
      # cumulative share of cases is covered.
      min_case_coverage: 0.80
    decided_on: "2026-08-25"
    rationale: >-
      Full scope, all 11,973 variants, no truncation. The feasibility concern this decision existed
      to manage is settled empirically rather than estimated: a full-scope intent-guided run through
      Steps 1-9 already exists at data/output/bpic2019/20260820_135000/, so the ~24k-call figure in
      the plan's original framing is superseded by an executed run. At assignment_batch_size=50 the
      full scope is ~240 Step-6 calls per condition. Truncating would also weaken Task C1's label-
      recovery comparison, whose interest is concentrated in the rare regimes (two_way_matched draws
      13 variants at full scope and would be at risk of vanishing under top_n). analysis/report.py
      reports the scope's share of the full log's cases regardless, so this stays auditable if a
      later protocol_version revisits it. Re-cost against Task C9's wall-clock figures before adding
      Task C2's replicates and Experiment 2's perturbations, which multiply the call count.

  C10_assignment_batch_size:
    task: C10
    question: >-
      One assignment_batch_size across all three datasets, or one value plus a pre-registered
      BPIC 2019 exception on wall-clock-feasibility grounds?
    governs: [rtfm, sepsis, bpic2019]
    status: decided
    value:
      default: 50
      # Per-dataset exceptions. Each must be justified on call-count/wall-clock accounting only
      # (Task C10), never against observed categorization quality. Empty = one value everywhere.
      exceptions: {}
    decided_on: "2026-08-19"
    rationale: >-
      50 everywhere (raised from 20), on call-count/wall-clock grounds only, per Task C10's
      required basis — not against observed categorization quality. Google AI Studio billing was
      enabled on the project behind GEMINI_API_KEY and verified at aistudio.google.com/rate-limit:
      4,000 RPM / 4M TPM for gemini-3.5-flash-lite (150K RPD), several orders of magnitude above
      this protocol's actual volume. At batch_size=50 with protocol.yaml's concurrency=5, a
      231-variant run costs ~5 Step-6 calls instead of 231/12 (batch=20); BPIC 2019 at the C7
      top_n=1000 scope costs ~20 calls instead of 50. No BPIC 2019 exception needed: one value
      holds the freeze table's "identical across datasets by default" with nothing to justify.
      Not yet empirically re-validated against a frozen run at this batch size — the example
      case studies under experimentation/examples/ (not the frozen protocol) are the first runs
      to exercise batch_size=50, and should be watched for any assignment-quality regression
      before the first real frozen run under this protocol_version.

  C6_sepsis_perturbations:
    task: C6
    question: Run Experiment 2's goal-model perturbations on Sepsis as well as RTFM?
    governs: [sepsis]
    status: decided
    value: true
    decided_on: "2026-08-29"
    rationale: >-
      Adopted, superseding the 2026-08-25 decision. The validity ground for refusal no longer
      holds: re-run under this session's fixes (Task C12's is_stable now matches by anchor_ids per
      §4, not by cosmetic category-label text — see conditions.py/report.py/prompt_taxonomy_
      intent_guided.txt fixes, 2026-08-29) shows Sepsis's Step 5a induction IS stable — 5
      identical-input reruns produced the identical anchor set {15,16,17,18,19,20,21} every time.
      The earlier "three distinct anchor sets" finding is now attributed at least in part to the
      anchor-inclusion prompt defect fixed the same day, not to genuine induction instability.
      The budget ground was never binding on its own and is smaller than originally scoped: E2's
      baseline condition reuses the existing e1_guided_rep1 run at zero additional cost (identical
      run_id under experiment="e1"), so only the two perturbation conditions (A, B) are net new —
      roughly 36 LLM calls total (~18 each, matching one guided e1 condition's Step 5+6 cost),
      well under $1 at this session's measured RTFM per-call cost. Revisit only if a future C12
      rerun on Sepsis (e.g. after any further goal-model or prompt change) shows instability again.

  C5_label_list_control:
    task: C5
    question: >-
      Add the label-list control condition (same cardinality as T^G, domain-plausible, not
      goal-derived) separating "externally declared intent" from "any externally supplied label
      list"?
    governs: [rtfm, sepsis, bpic2019]
    status: decided
    value: false
    decided_on: "2026-08-25"
    rationale: >-
      Not adopted for the minimum design. It remains the highest-value optional item and also
      its largest budget increase (a third full arm on every dataset). The confound it addresses -
      that the guided prompt supplies an axis AND a cardinality AND a vocabulary AND extra context
      at once - is instead carried explicitly as a Threat to Validity, and Task C11a's
      guided_no_sample ablation attacks the same attribution question for one LLM call per dataset
      rather than a full arm. THIS IS THE MOST REVISITABLE DECISION HERE: conditions.py already
      supports arm "label_list", so flipping this to true costs configuration plus LLM budget, no
      new code. Do it before any frozen run rather than after, per this file's own discipline.

  D6_open_arm_steps_7_9:
    task: D6
    question: Do the open-mode arms run Steps 7-8 at all, or run them and exclude them from RQ1?
    governs: [rtfm, sepsis, bpic2019]
    status: decided
    # run_both | run_guided_only | run_neither  (Step 9 never runs in a frozen condition)
    value: run_neither
    decided_on: "2026-08-25"
    rationale: >-
      Neither arm runs Steps 7-8 in a frozen condition. They are descriptive only (§9) and
      confounded by partition granularity - finer, purer subsets fit more easily almost
      mechanically - so a cross-condition fitness/precision comparison is not informative about
      which taxonomy is better. Skipping both keeps the arms symmetric at zero extra LLM cost and
      loses nothing RQ1 depends on; Step 7 is regenerable later from a frozen run's assignments.csv
      + taxonomy.json without re-billing Step 6. Step 8 additionally is NOT comparable across arms
      (Task E6: its goal-alignment judgment reads goal-model text under guided mode and the
      category's own Step 5 rationale under open mode). Step 7b is governed separately by C13 and
      is guided-arm-only by construction, since open categories carry no anchor_ids.

  C13_step7b_indicators:
    task: C13
    question: >-
      Does Step 7b (KPI/indicator satisfaction, measured rather than LLM-judged) run in the frozen
      conditions, and for which datasets?
    governs: [rtfm, sepsis, bpic2019]
    status: decided
    # run_guided_only | run_neither   (never "both": open categories have no anchor_ids to measure)
    value:
      policy: run_guided_only
      datasets: [rtfm]
    decided_on: "2026-08-25"
    rationale: >-
      RTFM guided arm only. Step 7b measures indicator satisfaction from the log against the goal
      model's declared KPIs, so it is the one result in the paper not exposed to the LLM-dependence
      threat - it is the single counterweight to it. It cannot run in the open arm at
      all: open-mode categories carry no anchor_ids, so there is nothing to attach an indicator to,
      which also means it can never enter RQ1's paired contrast and is reported as characterization
      of the guided arm, not as validation. Scoped to RTFM because only rtfm_goal_model.jucm (v1.2)
      and rtfm_mini_goal_model.jucm declare indicators; the Sepsis and BPIC 2019 models' indicators
      are this project's own log-computed percentiles rather than organizational targets. Reporting
      requirement: indicators with low applicability are reported as NOT-APPLICABLE, never as bad
      values - RTFM's timely_payment category has 7% dispatch-indicator coverage because most of its
      cases paid before dispatch occurred, and scoring that as a bad value would invert the
      measurement.

  E2_degenerate_or_after_perturbation:
    task: E2
    question: >-
      Experiment 2, Perturbation A: when removing an alternative leaves its OR-parent with exactly
      one remaining child, is the now-vacuous decomposition collapsed into the parent, or kept?
    governs: [rtfm, sepsis]
    status: decided
    # keep | collapse
    value: keep
    decided_on: "2026-08-25"
    rationale: >-
      Keep the degenerate one-child decomposition. Verified concretely: removing element 19
      (judicial appeal) from rtfm_goal_model.jucm leaves OR-point 7 with the single child 14. Two
      defensible options existed; keeping is chosen because collapsing changes the goal tree's DEPTH
      as well as its breadth, and Task C12 establishes that Step 5a's output is sensitive to which
      level of the tree it anchors at - so a collapse would confound the perturbation's effect with
      an anchoring-level change. Keeping perturbs exactly one thing: the alternative set at one
      OR-point. Pre-registered here because it is a free parameter that would otherwise be settled
      silently by whichever behaviour perturb.py happened to implement.

  D1_divergence_convention:
    task: D1
    question: AMI/NMI convention — residual handling and variant- vs. case-weighting.
    governs: [rtfm, sepsis, bpic2019]
    status: decided
    value:
      residual_handling: own_cluster   # own_cluster | exclude
      weighting: variant               # variant | case
      # Reported for both conventions regardless; this names the one the paper quotes.
    decided_on: "2026-08-19"
    rationale: >-
      Fixed before any number is computed, per §7. The residual is its own block (it is a
      substantive outcome of the guided arm, not missing data), and the primary weighting is
      variant-level to match |T| and the contingency matrix's primary unit. analysis/divergence.py
      computes all four combinations and marks this one as primary, so the choice is auditable
      rather than implicit — but it is never reported as accuracy (§1).

  D7_single_llm:
    task: D7
    question: Add an open-weights (Ollama) replication arm?
    governs: [rtfm, sepsis, bpic2019]
    status: decided
    value: false
    decided_on: "2026-08-19"
    rationale: >-
      Decided — not adopted. One provider/model (Gemini) throughout; cross-model robustness is
      future work and a recorded Threat to Validity, not an experimental condition.
