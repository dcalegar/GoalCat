# ICPM 2027 — frozen experimental protocol (the freeze table).
#
# Every element the freeze table requires to be *identical* between the intent-guided and open
# arms of a paired within-log comparison is declared once, here, and merged into each condition's
# generated config by protocol.py — so the two arms cannot drift apart by an editing mistake in
# one of two hand-maintained YAML files. What legitimately differs between arms (taxonomy_mode,
# goal_model_filename) is not in this file at all; it is set per condition by the driver.
#
# Changing anything here invalidates every already-executed frozen run: bump protocol_version and
# re-run, never edit a value under a version that has already produced results.

protocol_version: "1.0.0"

# Steps 1-4, computed once per dataset and shared by every condition (§2.1).
sampling:
  sample_frequent_n: 10
  sample_rare_n: 10
  sample_extreme_n: 5

# Step 7 hyperparameter, uniform across categories and datasets (no per-case tuning).
discovery:
  discovery_noise_threshold: 0.0

# Freeze table rows "LLM / provider / model", "LLM parameters", "Assignment batch size" (Task
# C10). One provider/model throughout — Task D7 (single-LLM decision, no Ollama replication arm).
llm:
  taxonomy_model: "gemini/gemini-3.5-flash-lite"
  assignment_model: "gemini/gemini-3.5-flash-lite"
  description_model: "gemini/gemini-3.5-flash-lite"
  # USD per 1M tokens, standard tier — used only to annotate *_run_metadata.json with
  # estimated_cost_usd per call (see src/goalcat/config.yaml for the full rationale). Verified
  # 2026-08-19 at ai.google.dev/gemini-api/docs/pricing.
  pricing_usd_per_million_tokens:
    "gemini/gemini-3.5-flash-lite":
      input: 0.30
      output: 2.50
  # Task D3: temperature pinned for the frozen runs. 0 is not a determinism guarantee — see
  # manifest.py's note on what this stack can and cannot record about run-to-run identity, and
  # Task C2's replicate runs, which measure the residual variance empirically rather than
  # assuming it away.
  temperature: 0
  timeout_seconds: 120
  max_retries: 3
  # 5, not 1: raised 2026-08-19 after confirming the Google AI Studio project behind
  # GEMINI_API_KEY is on the paid tier (4,000 RPM / 4M TPM, verified at
  # aistudio.google.com/rate-limit) — see README.md's "LLM backend" section. Held identical
  # across arms either way.
  concurrency: 5
  # null once the account's paid-tier RPM is high enough to absorb bursts via litellm's own
  # backoff; a number paces Step 6's call starts proactively (see llm/assignment.py's
  # _RateLimiter). Held identical across arms either way.
  requests_per_minute: null
  # Task C10 — a fixed protocol parameter, never tuned against categorization output. The value
  # actually used is resolved through preregistration.yaml (which may pre-register a documented
  # per-dataset exception on wall-clock grounds); this is the protocol default.
  assignment_batch_size: 50

# Which pipeline steps a frozen condition executes. Step 9 is deliberately absent: §3's paired
# comparison runs *before* any analyst merge/split/rename, so no frozen condition may reach it.
# Steps 7-8 are descriptive only (§9) and are off by default pending Task D6.
steps:
  default: [5, 6]
  with_descriptive: [5, 6, 7, 8]

# Task C2 — replicate runs of each unperturbed condition, to establish the noise floor against
# which Experiment 2's CollateralReassignment is interpreted (§4).
replicates:
  unperturbed: 2
  perturbed: 1
  # Task C12 — Step 5a induction stability. A DIFFERENT quantity from `unperturbed` above: that
  # one re-runs a whole condition (Steps 5 AND 6) to establish Step 6's partition noise floor
  # under a fixed taxonomy; this one re-runs Step 5a alone to test whether the taxonomy is stable
  # in the first place. Sepsis settles that the two are not the same question — four
  # identical-input guided runs there produced three distinct anchor sets, at three different
  # levels of the goal tree. k=5 per the plan's k>=5; one LLM call each, so the whole check costs
  # ~15 calls across the three datasets.
  taxonomy_induction: 5
